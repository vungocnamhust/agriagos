    get:
      tags:
      - Health
      summary: Get Health
      operationId: get_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/customers:
    post:
      tags:
      - Customers
      summary: Create Customer
      operationId: create_customer_api_v1_customers_post
